<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Suma de Positivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
            <a href="index.html" class="btn btn-outline-light">Volver al Índice</a>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 600px;">
        <div class="card shadow p-4 bg-white rounded">
            <h2 class="text-primary mb-3">2. Suma de Números Positivos</h2>
            <p class="text-muted mb-4">Ingresa números positivos uno a uno. El programa sumará todos hasta que teclees un cero o un número negativo.</p>

            <div class="mb-3">
                <label for="inputNumero" class="form-label">Introduce un número:</label>
                <input type="number" id="inputNumero" class="form-control">
            </div>

            <button class="btn btn-success w-100 mb-2" id="btnAgregarNumero">Agregar y Sumar</button>
            <button class="btn btn-outline-danger w-100 mb-3" id="btnReiniciarSuma">Reiniciar Suma</button>

            <div id="resultadoSuma" class="alert alert-secondary mt-3" role="alert">
                Suma total acumulada: 0
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/funciones.js"></script>
</body>
</html>
