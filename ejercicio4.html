<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - While y For</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
            <a href="index.html" class="btn btn-outline-light"><span class="navbar-toggler-icon"></span> Volver al Índice</a>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 700px;">
        <div class="card shadow p-4 bg-white rounded mb-4">
            <h2 class="text-primary mb-3">II.- While y For</h2>

            <div class="mb-4 pb-3 border-bottom">
                <h5>1. Suma de Números Impares (1 al 100)</h5>
                <button class="btn btn-outline-success btn-sm mt-2" id="btnImpares">Calcular Suma</button>
                <div id="resImpares" class="mt-2 text-secondary fw-bold"></div>
            </div>

            <div class="mb-4 pb-3 border-bottom">
                <h5>2. Mostrar Asteriscos</h5>
                <div class="mb-2 mt-2">
                    <input type="number" id="inputAsteriscos" class="form-control" placeholder="¿Cuántos asteriscos deseas mostrar?">
                </div>
                <button class="btn btn-outline-success btn-sm mt-2" id="btnAsteriscos">Generar Asteriscos</button>
                <div id="resAsteriscos" class="mt-2 text-secondary fw-bold"></div>
            </div>

            <div>
                <h5>3. Tablas de Multiplicar (1 al 10)</h5>
                <button class="btn btn-outline-success btn-sm mt-2" id="btnTablas">Mostrar Tablas</button>
                <div id="resTablas" class="mt-2 text-secondary fw-bold"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/funciones.js"></script>
</body>
</html>
