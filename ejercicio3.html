<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 - If-Else y Case</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
            <a href="index.html" class="btn btn-outline-light"><span class="navbar-toggler-icon"></span> Volver al Índice</a>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 700px;">
        <div class="card shadow p-4 bg-white rounded mb-4">
            <h2 class="text-primary mb-3">3. Estructuras If-Else y Case</h2>
            
            <div class="mb-4 pb-3 border-bottom">
                <h5>A) 3 Números de Mayor a Menor</h5>
                <div class="row g-2 mb-2">
                    <div class="col"><input type="number" id="num1" class="form-control" placeholder="Número 1"></div>
                    <div class="col"><input type="number" id="num2" class="form-control" placeholder="Número 2"></div>
                    <div class="col"><input type="number" id="num3" class="form-control" placeholder="Número 3"></div>
                </div>
                <button class="btn btn-outline-primary btn-sm mt-2" id="btnMayorMenor">Ordenar de Mayor a Menor</button>
                <div id="resMayorMenor" class="mt-2 text-secondary fw-bold"></div>
            </div>

            <div class="mb-4 pb-3 border-bottom">
                <h5>B) Cálculo de Importe Neto e Impuestos</h5>
                <div class="mb-2">
                    <input type="number" id="importeInput" class="form-control" placeholder="Ingresa el importe bruto">
                </div>
                <button class="btn btn-outline-primary btn-sm mt-2" id="btnImporte">Calcular Importe Neto</button>
                <div id="resImporte" class="mt-2 text-secondary fw-bold"></div>
            </div>

            <div>
                <h5>C) Sueldo según Años en la Empresa</h5>
                <div class="mb-2">
                    <input type="number" id="anosInput" class="form-control" placeholder="Ingresa los años en la empresa">
                </div>
                <button class="btn btn-outline-primary btn-sm mt-2" id="btnSueldo">Calcular Sueldo</button>
                <div id="resSueldo" class="mt-2 text-secondary fw-bold"></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/funciones.js"></script>
</body>
</html>
