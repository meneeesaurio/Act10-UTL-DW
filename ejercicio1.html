<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Votación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
            <a href="index.html" class="btn btn-outline-light"> <span class="navbar-toggler-icon"></span> Volver al Índice</a>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 600px;">
        <div class="card shadow p-4 bg-white rounded">
            <h2 class="text-primary mb-3">1. Votación por Sección</h2>
            <p class="text-muted mb-4">Selecciona tu sección de la ciudad y emite tu voto usando eventos y switch</p>

            <div class="mb-3">
                <label for="seccionSelect" class="form-label">Selecciona tu sección:</label>
                <select id="seccionSelect" class="form-select">
                    <option value="" selected disabled>Elige una opción</option>
                    <option value="norte">Norte</option>
                    <option value="sur">Sur</option>
                    <option value="centro">Centro</option>
                </select>
            </div>
            <button class="btn btn-primary w-100 mb-3" id="btnVotar">Emitir Voto</button>

            <div id="resultadoVoto" class="alert alert-secondary mt-3" role="alert">
                El resultado del voto aparecerá aquí.
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/funciones.js"></script>
</body>
</html>
