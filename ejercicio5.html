<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5 - Arreglos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-dark bg-primary px-3 shadow-sm">
            <a href="index.html" class="btn btn-outline-light"><span class="navbar-toggler-icon"></span> Volver al Índice</a>
        </nav>
    </header>

    <main class="container my-5" style="max-width: 700px;">
        <div class="card shadow p-4 bg-white rounded">
            <h2 class="text-primary mb-3">III.- Arreglos (10 Países)</h2>
            <p class="text-muted">Prueba de métodos de arreglos: Pop, Shift, Push, Unshift, Splice, Delete, Reverse, Sort, Concat, Join, Length</p>

            <div class="mb-3">
                <label class="form-label">Arreglo Base Actual:</label>
                <div id="arrayDisplay" class="alert alert-info">[]</div>
            </div>

            <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-sm btn-primary" id="btnPop">Pop()</button>
                <button class="btn btn-sm btn-primary" id="btnShift">Shift()</button>
                <button class="btn btn-sm btn-primary" id="btnPush">Push()</button>
                <button class="btn btn-sm btn-primary" id="btnUnshift">Unshift()</button>
                <button class="btn btn-sm btn-primary" id="btnSplice">Splice()</button>
                <button class="btn btn-sm btn-primary" id="btnReverse">Reverse()</button>
                <button class="btn btn-sm btn-primary" id="btnSort">Sort()</button>
                <button class="btn btn-sm btn-primary" id="btnLength">Length</button>
            </div>

            <div id="resultadoArreglo" class="alert alert-secondary mt-4">
                Resultado de la operación...
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/funciones.js"></script>
</body>
</html>
